services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-DRAGON}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DRAGON}
      POSTGRES_DB: POINT_OF_SALE
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_maintenance_workers=4"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
      - "-c"
      - "superuser_reserved_connections=10"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "statement_timeout=30000"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-DRAGON} -d POINT_OF_SALE"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: pgbouncer_debug
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-DRAGON}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-DRAGON}
      DB_NAME: POINT_OF_SALE
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 200
      MIN_POOL_SIZE: 50
      MAX_DB_CONNECTIONS: 800
      MAX_CLIENT_CONN: 10000
      RESERVE_POOL_SIZE: 100
      RESERVE_POOL_TIMEOUT: 5
      SERVER_IDLE_TIMEOUT: 600
      QUERY_TIMEOUT: 30
      SERVER_CONNECT_TIMEOUT: 10
      SERVER_LOGIN_RETRY: 5
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_RESET_QUERY_ALWAYS: 0
      TCP_KEEPALIVE: 1
      TCP_KEEPCNT: 5
      TCP_KEEPIDLE: 30
      TCP_KEEPINTVL: 10
      ADMIN_USERS: DRAGON
      STATS_USERS: DRAGON
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      LOG_POOLER_ERRORS: 1
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=${POSTGRES_PASSWORD:-DRAGON} psql -h localhost -p 5432 -U ${POSTGRES_USER:-DRAGON} -d pgbouncer -c 'SHOW POOLS;' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  db-migration:
    build:
      context: ../..
      dockerfile: db-migration/Dockerfile
    image: modular-monolith-vertx-point-of-sale/db-migration:latest
    container_name: db-migration
    restart: "no"
    environment:
      - DB_HOST_MIGRATE=postgres
      - DB_PORT=5432
      - DB_NAME=POINT_OF_SALE
      - DB_USERNAME=${POSTGRES_USER:-DRAGON}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-DRAGON}
      - DB_SEEDER=${DB_SEEDER:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  redis-node-1:
    image: redis:7.4
    container_name: redis_node_1
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --requirepass ${REDIS_PASSWORD:-dragon_knight} --masterauth ${REDIS_PASSWORD:-dragon_knight} --cluster-announce-ip 172.18.0.40 --cluster-announce-hostname redis-node-1 --cluster-preferred-endpoint-type ip
    ports:
      - "6379:6379"
    volumes:
      - redis_node_1_data:/data
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 172.18.0.40
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dragon_knight} --no-auth-warning ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-node-2:
    image: redis:7.4
    container_name: redis_node_2
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --requirepass ${REDIS_PASSWORD:-dragon_knight} --masterauth ${REDIS_PASSWORD:-dragon_knight} --cluster-announce-ip 172.18.0.41 --cluster-announce-hostname redis-node-2 --cluster-preferred-endpoint-type ip
    volumes:
      - redis_node_2_data:/data
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 172.18.0.41
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dragon_knight} --no-auth-warning ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-node-3:
    image: redis:7.4
    container_name: redis_node_3
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --requirepass ${REDIS_PASSWORD:-dragon_knight} --masterauth ${REDIS_PASSWORD:-dragon_knight} --cluster-announce-ip 172.18.0.42 --cluster-announce-hostname redis-node-3 --cluster-preferred-endpoint-type ip
    volumes:
      - redis_node_3_data:/data
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 172.18.0.42
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dragon_knight} --no-auth-warning ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-node-4:
    image: redis:7.4
    container_name: redis_node_4
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --requirepass ${REDIS_PASSWORD:-dragon_knight} --masterauth ${REDIS_PASSWORD:-dragon_knight} --cluster-announce-ip 172.18.0.43 --cluster-announce-hostname redis-node-4 --cluster-preferred-endpoint-type ip
    volumes:
      - redis_node_4_data:/data
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 172.18.0.43
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dragon_knight} --no-auth-warning ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-node-5:
    image: redis:7.4
    container_name: redis_node_5
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --requirepass ${REDIS_PASSWORD:-dragon_knight} --masterauth ${REDIS_PASSWORD:-dragon_knight} --cluster-announce-ip 172.18.0.44 --cluster-announce-hostname redis-node-5 --cluster-preferred-endpoint-type ip
    volumes:
      - redis_node_5_data:/data
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 172.18.0.44
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dragon_knight} --no-auth-warning ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-node-6:
    image: redis:7.4
    container_name: redis_node_6
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --requirepass ${REDIS_PASSWORD:-dragon_knight} --masterauth ${REDIS_PASSWORD:-dragon_knight} --cluster-announce-ip 172.18.0.45 --cluster-announce-hostname redis-node-6 --cluster-preferred-endpoint-type ip
    volumes:
      - redis_node_6_data:/data
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 172.18.0.45
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dragon_knight} --no-auth-warning ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-cluster-creator:
    image: redis:7.4
    container_name: redis_cluster_creator
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: >
      sh -c "set -u;
      while true; do
        if redis-cli -h redis-node-1 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_known_nodes:1' &&
           redis-cli -h redis-node-2 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_known_nodes:1' &&
           redis-cli -h redis-node-3 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_known_nodes:1' &&
           redis-cli -h redis-node-4 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_known_nodes:1' &&
           redis-cli -h redis-node-5 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_known_nodes:1' &&
           redis-cli -h redis-node-6 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_slots_assigned:0'; then
          echo 'Creating fresh Redis cluster';
          echo 'yes' | redis-cli -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning --cluster create
          redis-node-1:6379 redis-node-2:6379 redis-node-3:6379
          redis-node-4:6379 redis-node-5:6379 redis-node-6:6379
          --cluster-replicas 1 || true;
        else
          echo 'Refreshing Redis peer addresses without deleting data';
          for node in 172.18.0.40 172.18.0.41 172.18.0.42 172.18.0.43 172.18.0.44 172.18.0.45; do
            redis-cli -h redis-node-1 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster meet $${node} 6379 || true;
          done;
        fi;
        sleep 15;
      done"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -h redis-node-1 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_state:ok' && redis-cli -h redis-node-1 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_known_nodes:6' && redis-cli -h redis-node-1 -a $${REDIS_PASSWORD:-dragon_knight} --no-auth-warning cluster info | grep -q 'cluster_slots_ok:16384'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app_network

  kafka:
    image: apache/kafka:3.9.0
    container_name: my-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: kraft-cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  pyroscope:
    image: grafana/pyroscope:1.7.1
    restart: unless-stopped
    ports:
      - 4040:4040
    networks:
      - app_network

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: "host"
    networks:
      - app_network
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ../../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/rules:/etc/prometheus/rules
    networks:
      - app_network
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - app_network
    depends_on:
      - prometheus
      - jaeger
      - alertmanager
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"
    depends_on:
      - jaeger
    networks:
      - app_network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14250:14250"
    networks:
      - app_network
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    networks:
      - app_network
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=my-kafka:9092"
      - "--web.listen-address=0.0.0.0:9308"
      - "--log.level=debug"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    container_name: loki
    image: grafana/loki:3.5.8
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_network

  promtail:
    container_name: promtail
    image: grafana/promtail:3.5.8
    restart: unless-stopped
    volumes:
      - ../../observability/promtail-local-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - app_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-DRAGON}:${POSTGRES_PASSWORD:-DRAGON}@postgres:5432/POINT_OF_SALE?sslmode=disable&connect_timeout=10"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  loki-data:
  promtail-data:
  grafana-storage:
  postgres_data:
  kafka_data:
  redis_node_1_data:
  redis_node_2_data:
  redis_node_3_data:
  redis_node_4_data:
  redis_node_5_data:
  redis_node_6_data:

networks:
  app_network:
    driver: bridge
